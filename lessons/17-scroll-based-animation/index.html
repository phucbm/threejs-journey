  <style>
    /* ported verbatim from the original pages/17.vue <style> block —
       required for the scroll-driven demo (fixed canvas + scrollable sections) */
    html,
    body {
      overflow: auto;
      background-color: #1e1a20;
    }

    .webgl {
      position: fixed;
      top: 0;
      left: 0;
      outline: none;
    }

    .section {
      display: flex;
      align-items: center;
      height: 100vh;
      position: relative;
      color: #ffeded;
      text-transform: uppercase;
      font-size: 7vmin;
      padding-left: 10%;
      padding-right: 10%;
    }

    section:nth-child(odd) {
      justify-content: flex-end;
    }
  </style>

    <canvas class="webgl"></canvas>
